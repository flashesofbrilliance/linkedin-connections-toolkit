[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-connections-toolkit"
version = "0.1.0"
description = "Parse and analyze a LinkedIn Connections.csv export. Dependency-free, offline, on data you already own."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Zach Harris" }]
keywords = ["linkedin", "connections", "csv", "network", "analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
linkedin-connections = "linkedin_connections.__main__:main"

[project.urls]
Homepage = "https://github.com/flashesofbrilliance/linkedin-connections-toolkit"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_connections"]
